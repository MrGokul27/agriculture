<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | AgriFarm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow-x: hidden;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0f2410;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ---- Animated background ---- */
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .bg-layer::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(61, 128, 64, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(155, 225, 93, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 60% 80%,
            rgba(26, 60, 26, 0.4) 0%,
            transparent 60%
          );
      }

      /* Floating circles */
      .circle {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(155, 225, 93, 0.12);
        animation: floatCircle linear infinite;
      }
      .c1 {
        width: 300px;
        height: 300px;
        top: -100px;
        left: -80px;
        animation-duration: 20s;
      }
      .c2 {
        width: 200px;
        height: 200px;
        bottom: 10%;
        right: 5%;
        animation-duration: 15s;
        animation-delay: -5s;
      }
      .c3 {
        width: 150px;
        height: 150px;
        top: 40%;
        left: 5%;
        animation-duration: 18s;
        animation-delay: -8s;
      }
      .c4 {
        width: 80px;
        height: 80px;
        top: 20%;
        right: 20%;
        animation-duration: 12s;
        animation-delay: -3s;
        border-color: rgba(61, 128, 64, 0.2);
      }
      .c5 {
        width: 500px;
        height: 500px;
        bottom: -200px;
        right: -150px;
        animation-duration: 25s;
        animation-delay: -10s;
        border-color: rgba(155, 225, 93, 0.05);
      }

      @keyframes floatCircle {
        0% {
          transform: rotate(0deg) translateX(20px) rotate(0deg);
        }
        100% {
          transform: rotate(360deg) translateX(20px) rotate(-360deg);
        }
      }

      /* Falling leaves */
      .leaf {
        position: absolute;
        font-size: 20px;
        opacity: 0;
        animation: fallLeaf linear infinite;
        color: #3d8040;
      }
      @keyframes fallLeaf {
        0% {
          opacity: 0;
          transform: translateY(-20px) rotate(0deg);
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.3;
        }
        100% {
          opacity: 0;
          transform: translateY(100vh) rotate(720deg);
        }
      }

      /* ---- Main content ---- */
      .page-wrap {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 20px;
        text-align: center;
      }

      /* Logo */
      .err-logo {
        margin-bottom: 40px;
      }
      .err-logo a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .err-logo span {
        font-size: 26px;
        font-weight: 800;
        color: #fff;
        letter-spacing: 1px;
      }
      .err-logo i {
        font-size: 28px;
        color: #9be15d;
      }

      /* 404 number */
      .err-number {
        position: relative;
        display: inline-block;
        margin-bottom: 10px;
      }
      .err-number h1 {
        font-size: clamp(120px, 20vw, 220px);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(
          135deg,
          #9be15d 0%,
          #3d8040 50%,
          #1a3c1a 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -8px;
        filter: drop-shadow(0 0 40px rgba(155, 225, 93, 0.25));
      }

      /* Leaf icon inside 0 */
      .err-number .leaf-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(40px, 6vw, 80px);
        color: rgba(155, 225, 93, 0.15);
        animation: spinSlow 8s linear infinite;
        pointer-events: none;
      }
      @keyframes spinSlow {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* Divider plant */
      .err-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 auto 28px;
        width: fit-content;
      }
      .err-divider::before,
      .err-divider::after {
        content: "";
        width: 60px;
        height: 1px;
        background: linear-gradient(to right, transparent, #3d8040);
      }
      .err-divider::after {
        background: linear-gradient(to left, transparent, #3d8040);
      }
      .err-divider i {
        color: #9be15d;
        font-size: 18px;
      }

      .err-title {
        font-size: clamp(22px, 4vw, 36px);
        font-weight: 800;
        color: #fff;
        margin-bottom: 16px;
      }

      .err-text {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.55);
        max-width: 480px;
        margin: 0 auto 40px;
        line-height: 1.8;
      }

      /* Buttons */
      .err-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 60px;
      }

      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #3d8040;
        color: #fff;
        padding: 14px 32px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        transition: all 0.3s;
        box-shadow: 0 6px 24px rgba(61, 128, 64, 0.4);
      }
      .btn-home:hover {
        background: #9be15d;
        color: #1a3c1a;
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(155, 225, 93, 0.35);
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        padding: 14px 32px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s;
      }
      .btn-back:hover {
        border-color: #3d8040;
        color: #9be15d;
        transform: translateY(-3px);
      }

      /* Quick links */
      .err-links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .err-links a {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s;
      }
      .err-links a:hover {
        color: #9be15d;
        border-color: rgba(155, 225, 93, 0.3);
        background: rgba(155, 225, 93, 0.05);
      }

      /* Footer strip */
      .err-footer {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 20px;
        color: rgba(255, 255, 255, 0.2);
        font-size: 13px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .err-footer a {
        color: #3d8040;
        text-decoration: none;
      }

      /* Glowing orb */
      .glow-orb {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(61, 128, 64, 0.08) 0%,
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: pulseOrb 4s ease-in-out infinite;
      }
      @keyframes pulseOrb {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated background -->
    <div class="bg-layer">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
      <div class="circle c4"></div>
      <div class="circle c5"></div>
      <!-- Falling leaves (JS generated) -->
    </div>

    <!-- Main content -->
    <div class="page-wrap">
      <div class="glow-orb"></div>

      <!-- Logo -->
      <div class="err-logo">
        <a href="index.html">
          <!-- <i class="fa fa-leaf"></i> -->
          <span>
            <img
              src="assets/images/logoStackly.webp"
              width="150"
              alt="stacklylogo"
            />
          </span>
        </a>
      </div>

      <!-- 404 -->
      <div class="err-number">
        <h1>404</h1>
        <i class="fa fa-seedling leaf-icon"></i>
      </div>

      <!-- Divider -->
      <div class="err-divider">
        <i class="fa fa-leaf"></i>
      </div>

      <h2 class="err-title">Oops! Page Not Found</h2>
      <p class="err-text">
        The page you're looking for seems to have wandered off into the fields.
        Don't worry — let's get you back on the right path.
      </p>

      <!-- Action buttons -->
      <div class="err-actions">
        <a href="index.html" class="btn-home">
          <i class="fa fa-home"></i> Back to Home
        </a>
        <a href="javascript:history.back()" class="btn-back">
          <i class="fa fa-arrow-left"></i> Go Back
        </a>
      </div>

      <!-- Quick links -->
      <!-- <div class="err-links">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#blog">Blog</a>
        <a href="index.html#contact">Contact</a>
      </div> -->
    </div>

    <!-- Footer -->
    <!-- <div class="err-footer">
      <p>&copy; 2026 <a href="index.html">AgriFarm</a>. All Rights Reserved.</p>
    </div> -->

    <script>
      // Generate falling leaves
      const bg = document.querySelector(".bg-layer");
      const leafIcons = ["fa-leaf", "fa-seedling", "fa-spa"];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("i");
        el.className = `fa ${leafIcons[i % 3]} leaf`;
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = "-30px";
        el.style.fontSize = 12 + Math.random() * 16 + "px";
        el.style.animationDuration = 8 + Math.random() * 14 + "s";
        el.style.animationDelay = -(Math.random() * 20) + "s";
        el.style.opacity = (0.1 + Math.random() * 0.4).toString();
        bg.appendChild(el);
      }
    </script>
  </body>
</html>
