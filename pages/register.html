<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — AgriFarm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page auth-page--register">
      <!-- Left Panel: Form -->
      <div class="auth-panel auth-panel--form">
        <div class="auth-form-wrap">
          <div class="auth-form-header">
            <span class="auth-form-tag"
              ><i class="fa fa-user-plus me-1"></i>Create Account</span
            >
            <h2>Join the AgriFarm Community</h2>
            <p>
              Already have an account? <a href="login.html">Sign in here</a>
            </p>
          </div>

          <form class="auth-form" id="registerForm">
            <div class="row">
              <!-- Username -->
              <div class="col-md-6">
                <div class="auth-field">
                  <label><i class="fa fa-user"></i> Username</label>
                  <input
                    type="text"
                    class="auth-input"
                    placeholder="Choose a username"
                    required
                  />
                </div>
              </div>

              <!-- Role -->
              <div class="col-md-6">
                <div class="auth-field">
                  <label><i class="fa fa-user-tag"></i> Role</label>
                  <div class="auth-select-wrap">
                    <select class="auth-input" required>
                      <option value="" disabled selected>
                        Select your role
                      </option>
                      <option>Farmer</option>
                      <option>Agronomist</option>
                      <option>Supplier</option>
                      <option>Buyer</option>
                    </select>
                    <i class="fa fa-chevron-down auth-select-arrow"></i>
                  </div>
                </div>
              </div>
            </div>
            <!-- Email -->
            <div class="auth-field">
              <label><i class="fa fa-envelope"></i> Email Address</label>
              <input
                type="email"
                class="auth-input"
                placeholder="you@example.com"
                name="email"
                id="email"
                autocomplete="email"
                required
              />
            </div>

            <!-- Password -->
            <div class="auth-field">
              <label><i class="fa fa-lock"></i> Password</label>
              <div class="row">
                <div class="col-md-6">
                  <div class="auth-input-wrap">
                    <input
                      type="password"
                      class="auth-input"
                      id="regPassword"
                      placeholder="Create a strong password"
                      name="password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="auth-eye"
                      onclick="togglePass('regPassword', this)"
                    >
                      <i class="fa fa-eye"></i>
                    </button>
                  </div>
                </div>
                <!-- Confirm Password -->
                <div class="col-md-6">
                  <div class="auth-input-wrap">
                    <input
                      type="password"
                      class="auth-input"
                      id="regConfirmPassword"
                      placeholder="Confirm password"
                      name="confirm_password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="auth-eye"
                      onclick="togglePass('regConfirmPassword', this)"
                    >
                      <i class="fa fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Forgot Password link -->
            <div class="auth-field">
              <a href="#" class="auth-forgot-link"
                ><i class="fa fa-key me-1"></i>Forgot your password?</a
              >
            </div>

            <!-- Terms & Conditions -->
            <div class="auth-field">
              <label class="auth-check d-flex">
                <input type="checkbox" required />
                <span class="auth-check-box"></span>
                I agree to the
                <a href="#" class="auth-terms">Terms &amp; Conditions</a> and
                <a href="#" class="auth-terms">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="auth-btn">
              <span>Create Account</span><i class="fa fa-arrow-right ms-2"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Right Panel: Image -->
      <div
        class="auth-panel auth-panel--image"
        style="
          background-image: url(&quot;../assets/images/main-slider-v1-2.webp&quot;);
        "
      >
        <div class="auth-panel__overlay"></div>
        <div class="auth-panel__content">
          <a href="../index.html" class="auth-nav__home">
            <i class="fa fa-arrow-left me-1"></i>Back to Home
          </a>
          <div class="auth-panel__logo">
            <img src="../assets/images/logoStackly.webp" alt="AgriFarm" />
          </div>
          <h2 class="auth-panel__title">Grow With <br />AgriFarm</h2>
          <p class="auth-panel__text">
            Join thousands of farmers and agriculture professionals building a
            sustainable future together.
          </p>
          <div class="auth-panel__stats">
            <div class="auth-stat">
              <strong>12K+</strong>
              <span>Farmers</span>
            </div>
            <div class="auth-stat">
              <strong>500+</strong>
              <span>Projects</span>
            </div>
            <div class="auth-stat">
              <strong>98%</strong>
              <span>Satisfaction</span>
            </div>
          </div>
        </div>
        <div class="auth-panel__wave">
          <svg
            viewBox="0 0 200 200"
            xmlns="http://www.w3.org/2000/svg"
            class="auth-blob auth-blob--right"
          >
            <path
              fill="rgba(155,225,93,0.12)"
              d="M44.7,-62.3C56.2,-53.2,62.4,-37.5,66.2,-21.4C70,-5.3,71.4,11.2,65.5,24.8C59.6,38.4,46.4,49.1,32.1,56.5C17.8,63.9,2.4,68,-13.4,66.2C-29.2,64.4,-45.4,56.7,-56.3,44.5C-67.2,32.3,-72.8,15.6,-71.5,0C-70.2,-15.6,-62,-30.1,-51.2,-39.5C-40.4,-48.9,-27,-53.2,-13.2,-58.3C0.6,-63.4,33.2,-71.4,44.7,-62.3Z"
              transform="translate(100 100)"
            />
          </svg>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      var regForm = document.getElementById("registerForm");
      var pwd = document.getElementById("regPassword");
      var cpwd = document.getElementById("regConfirmPassword");

      regForm.addEventListener(
        "invalid",
        function (e) {
          const el = e.target;
          if (el === cpwd && pwd.value && el.value && el.value !== pwd.value) {
            el.setCustomValidity("Passwords do not match");
          } else if (el.type === "checkbox") {
            el.setCustomValidity("Please accept the Terms & Conditions");
          } else {
            const label = el.closest(".auth-field")?.querySelector("label");
            const name = label
              ? label.textContent.trim().replace(/^[^a-zA-Z]+/, "")
              : "This field";
            el.setCustomValidity(name + " is required");
          }
        },
        true,
      );

      regForm.addEventListener("input", function (e) {
        e.target.setCustomValidity("");
      });
      regForm.addEventListener("change", function (e) {
        const el = e.target;
        if (el.type === "checkbox") {
          el.setCustomValidity(
            el.checked ? "" : "Please accept the Terms & Conditions",
          );
        } else {
          el.setCustomValidity("");
        }
      });

      cpwd.addEventListener("input", function () {
        cpwd.setCustomValidity(
          cpwd.value !== pwd.value ? "Passwords do not match" : "",
        );
      });

      regForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (pwd.value !== cpwd.value) {
          cpwd.setCustomValidity("Passwords do not match");
          cpwd.reportValidity();
          return;
        }
        window.location.href = "login.html";
      });
      function togglePass(id, btn) {
        const inp = document.getElementById(id);
        const isText = inp.type === "text";
        inp.type = isText ? "password" : "text";
        btn.querySelector("i").className = isText
          ? "fa fa-eye"
          : "fa fa-eye-slash";
      }
      document.addEventListener("click", function (e) {
        const a = e.target.closest("a");
        if (a && a.getAttribute("href") === "#") {
          e.preventDefault();
          window.location.href = "../404.html";
        }
      });
    </script>
  </body>
</html>
