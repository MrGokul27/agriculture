    <div class="dashboard-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">

        <div class="sidebar-menu" id="dynamic-menu">

        <div class="sidebar-footer">

        </div>

      document.addEventListener("DOMContentLoaded", () => {
        const user = JSON.parse(localStorage.getItem("agriUser"));
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        document.getElementById("display-name").textContent = user.name;
        document.getElementById("display-email").textContent = user.email;
        document.getElementById("display-role").textContent = user.role;

        const menu = document.getElementById("dynamic-menu");

        // Tab configuration for logic
        const tabs = [
          {
            id: "dashboard",
            label: "Dashboard",
            icon: "fa-chart-pie",
            roles: ["All"],
          },
          {
            id: "analytics",
            label: "Farm Analytics",
            icon: "fa-chart-line",
            roles: ["Farmer", "Admin", "Agronomist"],
          },
          {
            id: "crops",
            label: "Crop Management",
            icon: "fa-seedling",
            roles: ["Farmer", "Admin"],
          },
          {
            id: "livestock",
            label: "Livestock",
            icon: "fa-cow",
            roles: ["Farmer", "Admin"],
          },
          {
            id: "soil",
            label: "Soil Reports",
            icon: "fa-microscope",
            roles: ["Agronomist", "Admin"],
          },
          {
            id: "weather",
            label: "Weather Center",
            icon: "fa-cloud-sun",
            roles: ["All"],
          },
          {
            id: "inventory",
            label: "Inventory",
            icon: "fa-warehouse",
            roles: ["Supplier", "Admin"],
          },
          {
            id: "orders",
            label: "Orders",
            icon: "fa-cart-shopping",
            roles: ["Buyer", "Supplier", "Admin"],
          },
          {
            id: "market",
            label: "Marketplace",
            icon: "fa-store",
            roles: ["Buyer", "Admin"],
          },
          {
            id: "finance",
            label: "Finance",
            icon: "fa-dollar-sign",
            roles: ["Admin", "Farmer"],
          },
          {
            id: "employees",
            label: "Employees",
            icon: "fa-users",
            roles: ["Admin"],
          },
          {
            id: "users",
            label: "User Management",
            icon: "fa-user-shield",
            roles: ["Admin"],
          },
          {
            id: "settings",
            label: "Settings",
            icon: "fa-gear",
            roles: ["All"],
          },
        ];

        // Filter tabs based on role
        const userTabs = tabs.filter(
          (tab) => tab.roles.includes("All") || tab.roles.includes(user.role),
        );

        // Build Sidebar
        menu.innerHTML = "";
        userTabs.forEach((tab, index) => {
          const activeClass = index === 0 ? "active" : "";
          menu.innerHTML += `
            <a href="#" class="nav-link-custom ${activeClass}" data-page="${tab.id}" onclick="navigateTo('${tab.id}', this)">
                <i class="fa ${tab.icon}"></i> <span>${tab.label}</span>
            </a>`;
        });

        // Initial Load
        navigateTo("dashboard");
      });

      function navigateTo(pageId, element = null) {
        const user = JSON.parse(localStorage.getItem("agriUser"));
        const title = document.getElementById("page-title");
        const content = document.getElementById("page-content");

        // Update UI state
        if (element) {
          document
            .querySelectorAll(".nav-link-custom")
            .forEach((el) => el.classList.remove("active"));
          element.classList.add("active");
        }

        // Set Page Title
        title.textContent = pageId.charAt(0).toUpperCase() + pageId.slice(1);

        // Inject Content
        content.innerHTML =
          tabContent[pageId] ||
          `<div class="activity-card"><p>Coming Soon...</p></div>`;

        // If we are on dashboard, also render the role-based stats
        if (pageId === "dashboard") {
          renderDashboardStats(user.role);
        }

        if (window.innerWidth < 992) toggleSidebar();
      }

      function renderDashboardStats(role) {
        const statsContainer = document.getElementById("role-stats");
        if (!statsContainer) return;

        const statsConfig = {
          Farmer: ["Total Acres: 120", "Healthy Crops: 85%", "Live Orders: 4"],
          Agronomist: {
            stats: [
              "Assigned Fields: 12",
              "Reports Pending: 3",
              "Tests Sync: 100%",
            ],
          },
          Supplier: {
            stats: [
              "Stock Value: $45k",
              "Pending Delivery: 8",
              "Warehouse Cap: 72%",
            ],
          },
          Buyer: {
            stats: ["Total Spent: $1.2k", "Active Orders: 2", "Cart Items: 5"],
          },
          Admin: {
            stats: [
              "Total Users: 1,420",
              "Server Status: 100%",
              "Revenue: $250k",
            ],
          },
        };

        const currentStats =
          statsConfig[role]?.stats ||
          statsConfig[role] ||
          statsConfig["Farmer"];
        statsContainer.innerHTML = "";
        currentStats.forEach((stat) => {
          statsContainer.innerHTML += `
            <div class="col-md-4">
                <div class="stat-card">
                    <h6>${stat.split(":")[0]}</h6>
                    <h3>${stat.split(":")[1]}</h3>
                </div>
            </div>`;
        });
      }

      function logout() {
        localStorage.removeItem("agriUser");
        window.location.href = "login.html";
      }
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
      }
    </script>
  </body>
</html>
